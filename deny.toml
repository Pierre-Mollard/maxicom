# cargo deny check: licenses, advisories, bans, sources of the dependencies.

[advisories]
# the RustSec database (https://rustsec.org): a dependency with a known
# vulnerability, a yanked version or an unmaintained crate fails the check.
# A false alarm is listed in `ignore`, with its ID and why
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
