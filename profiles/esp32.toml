# The esp32 profile, written by maxicom with the profiles folder. Delete it
# if you don't want it: --write-config writes it again, --reset-config too.
# A link uses it with profiles = ["esp32"] in links.toml, or with
# --profile esp32. Its keys, commands, highlights and triggers are added to
# the global files' while the link is open, a name already there replaced.
#
# The reset commands drive RTS and DTR: keep flow control off on the link,
# as RTS/CTS lets the driver drive RTS. They are esptool's sequences for the
# usual auto-reset circuit (RTS to EN, DTR to IO0); a board without it, or
# with the lines inverted, needs its own: edit them here.

description = "ESP32 boards (ESP-IDF): log levels in color, reset and bootloader keys"
enabled = true # false: off, the links naming it open without it
# A command line run once the link opens, at start, on an attach and on an
# open, not on a reopen after a lost port. Uncomment to reset the board on
# connect, as idf.py monitor does: a whole boot log after each attach
# on_open = "board-reset"

[prefixed]
h = "board-reset" # the default key, now the RTS reset below
H = "bootloader"

[commands]
# EN is pulled low while RTS is on and DTR off: DTR goes off first, as an open
# leaves both on (Linux, macOS), and esptool's reset counts on its connect
board-reset = { run = "dtr off; rts on; sleep 100; rts off", help = "Reset through RTS (EN), the app runs" }
bootloader = { run = "dtr off; rts on; sleep 100; dtr on; rts off; sleep 50; dtr off", help = "Reset into the ROM bootloader, to flash" }
# the chips with a native USB-Serial/JTAG port (ESP32-S3, C3, C6...)
usb-bootloader = { run = "rts off; dtr off; sleep 100; dtr on; rts off; sleep 100; rts on; dtr off; rts on; sleep 100; dtr off; rts off", help = "Into the bootloader through the native USB port" }

# ESP-IDF's log lines start with their level: E (1234) tag: message
[highlights.esp-error]
line_start = ["E ("]
fg = "Red"

[highlights.esp-warning]
line_start = ["W ("]
fg = "Yellow"

[highlights.esp-info]
line_start = ["I ("]
fg = "Blue"

[highlights.esp-debug]
line_start = ["D (", "V ("]
fg = "DarkGray"

# ESP-IDF's crash messages: a notice each, the line marked c, so Ctrl-a ' then
# c (or jump-mark c) goes to the last crash; the triggers popup counts them
[triggers.esp-panic]
match = "Guru Meditation Error"
run = 'notify error "the board crashed"'
mark = "c"
rearm = true
armed = true
silent = true

[triggers.esp-abort]
match = "abort() was called"
run = 'notify error "abort() was called"'
mark = "c"
rearm = true
armed = true
silent = true

[triggers.esp-stack-overflow]
match = "A stack overflow in task"
run = 'notify error "a task overflowed its stack"'
mark = "c"
rearm = true
armed = true
silent = true

[triggers.esp-task-watchdog]
match = "Task watchdog got triggered"
run = 'notify error "the task watchdog fired"'
mark = "c"
rearm = true
armed = true
silent = true

[triggers.esp-brownout]
match = "Brownout detector was triggered"
run = 'notify warn "brownout: the supply voltage dropped"'
mark = "c"
rearm = true
armed = true
silent = true
