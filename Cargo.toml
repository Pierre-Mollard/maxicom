[package]
name = "maxicom"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Pierre Mollard <pierre.mollard@proton.me>"]
description = "A fast, modern serial terminal (minicom alternative) built with Rust and Ratatui"
readme = "README.md"
repository = "https://github.com/Pierre-Mollard/maxicom"
documentation = "https://pierre-mollard.github.io/maxicom/"
homepage = "https://github.com/Pierre-Mollard/maxicom"
keywords = ["serial", "terminal", "minicom", "tui", "vt100"]
categories = ["command-line-utilities", "hardware-support", "development-tools::debugging"]
include = [
    "src/**/*",
    "examples/**/*",
    "Cargo.toml",
    "/README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

[profile.profiling]
inherits = "release"
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
ansi-to-tui = "8.0.1"
chrono = "0.4.45"
crossterm = "0.29.0"
dirs = "7.0.0"
humantime-serde = "1.1.1"
libc = "0.2.189"
memchr = "2.8.3"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serial2 = "0.2.38"
socket2 = { version = "0.6.5", features = ["all"] }
terminput = "0.5.15"
terminput-crossterm = "0.4.11"
toml = { version = "1.1.4", features = ["preserve_order"] }
tui-input = "0.15.4"
unicode-width = "0.2.2"
vt100 = "0.18.1"
