name: Bug report
description: Something in maxicom doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. A security issue goes in a private report
        instead, see [SECURITY.md](https://github.com/Pierre-Mollard/maxicom/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The keys you pressed or the commands you ran, from the start.
      placeholder: |
        1. maxicom /dev/ttyUSB0 -b 115200
        2. Ctrl-a m
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: maxicom version
      description: The first line of `maxicom --version`.
      placeholder: maxicom 0.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - Linux on WSL2
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: The terminal maxicom runs in, and tmux or screen if any.
      placeholder: Windows Terminal, kitty, gnome-terminal in tmux...
    validations:
      required: true

  - type: dropdown
    id: link
    attributes:
      label: Link
      options:
        - Serial port
        - TCP (ser2net, an ESP32 bridge, QEMU...)
        - A replay
        - Not related to the link
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and adapter
      description: The board, and the USB-serial adapter (`lsusb` names it on Linux).
      placeholder: ESP32-DevKitC, CP2102 (10c4:ea60), 115200 8N1

  - type: textarea
    id: config
    attributes:
      label: Config
      description: The settings you changed from the defaults, if any (`config.toml`, `keymap.toml`...).
      render: toml

  - type: textarea
    id: session
    attributes:
      label: Session backup or logs
      description: |
        If it's about what the device sent, the session's `.raw` and `.meta`
        let the bug be replayed exactly. In the session browser (`Ctrl-a j`),
        `c` copies the session's path. Zip the two files and drag the zip
        here. They hold everything the device sent: check there's no password
        or key in them first.
